name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Test
        run: npm test

      - name: Validate
        run: npm run validate

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage static artifacts
        run: |
          mkdir -p dist/fonts dist/src dist/styles
          cp index.html app.js styles.css favicon.svg og-image.png og-card.html preview.html dist/
          cp .nojekyll dist/
          cp -r styles/. dist/styles/
          cp -r src/. dist/src/
          cp fonts/NotoSerifSC-subset.woff2 dist/fonts/
          test -f dist/fonts/NotoSerifSC-subset.woff2 || { echo "ERROR: font subset missing"; exit 1; }
          test -f dist/styles/base.css || { echo "ERROR: styles/base.css missing"; exit 1; }
          test -f dist/src/data/generated/figure-evidence.json || { echo "ERROR: figure-evidence.json missing"; exit 1; }
          test -f dist/src/data/generated/figures-rationale.json || { echo "ERROR: figures-rationale.json missing"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

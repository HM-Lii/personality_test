
    <section class="quiz-shell" aria-labelledby="question-title">
      <div class="quiz-topline">
        <button class="back-button" type="button" data-action="previous" aria-label="上一题">←</button>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="测试进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
        >
          <div class="progress-bar" style="width:100%"></div>
        </div>
        <span class="progress-count">辨析 1/3</span>
      </div>

      <article class="question-card" data-question-id="RX1">
        <div class="question-number">
          辨析题
        </div>
        <h1 id="question-title"><span class="wb">出发</span><span class="wb">前</span><span class="wb">发现</span><span class="wb">行程</span><span class="wb">中有</span><span class="wb">一段</span><span class="wb">信息</span><span class="wb">不</span><span class="wb">完整</span></h1>
        <p class="question-context">多数情况下现场可以解决，但也存在小概率麻烦。</p>

        <div class="options" role="radiogroup" aria-label="选择最接近你真实反应的一项">
          
                <button
                  class="option "
                  type="button"
                  role="radio"
                  data-action="answer"
                  data-option-id="D"
                  aria-checked="false"
                >
                  <span class="option-letter">A</span>
                  <span class="option-text">尽量把可能的问题全问清楚再出发。</span>
                  <span class="option-arrow">→</span>
                </button>
              
                <button
                  class="option "
                  type="button"
                  role="radio"
                  data-action="answer"
                  data-option-id="B"
                  aria-checked="false"
                >
                  <span class="option-letter">B</span>
                  <span class="option-text">准备一个备用办法，再出发。</span>
                  <span class="option-arrow">→</span>
                </button>
              
                <button
                  class="option "
                  type="button"
                  role="radio"
                  data-action="answer"
                  data-option-id="C"
                  aria-checked="false"
                >
                  <span class="option-letter">C</span>
                  <span class="option-text">多查一点信息，减少不确定的地方。</span>
                  <span class="option-arrow">→</span>
                </button>
              
                <button
                  class="option "
                  type="button"
                  role="radio"
                  data-action="answer"
                  data-option-id="A"
                  aria-checked="false"
                >
                  <span class="option-letter">D</span>
                  <span class="option-text">照常出发，到现场再解决。</span>
                  <span class="option-arrow">→</span>
                </button>
              
        </div>
        <p class="question-hint">选真实反应，不选理想答案。<span class="hint-keys">可按 1–4 或 A–D 选择，← 返回上一题。</span></p>
      </article>
    </section>
